---
name: Terraform Difference Checks

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

on:
  pull_request:
    paths:
      - '**/*.tf'
      - '*.tf'
jobs:
  tf-checks-basic-example:
    if: github.actor != 'dependabot[bot]'
    uses: clouddrove/github-shared-workflows/.github/workflows/tf-checks.yml@v2
    with:
      working_directory: './examples/basic/'
      provider: 'aws'
      target_branch: 'master'
      aws_region: 'ca-central-1'
    secrets:
      BUILD_ROLE: ${{ secrets.BUILD_ROLE }}
  tf-checks-complete-example:
    if: github.actor != 'dependabot[bot]'
    uses: clouddrove/github-shared-workflows/.github/workflows/tf-checks.yml@v2
    with:
      working_directory: './examples/complete/'
      provider: 'aws'
      target_branch: 'master'
      aws_region: 'ca-central-1'
    secrets:
      BUILD_ROLE: ${{ secrets.BUILD_ROLE }}
  tf-checks-external-key-example:
    if: github.actor != 'dependabot[bot]'
    uses: clouddrove/github-shared-workflows/.github/workflows/tf-checks.yml@v2
    with:
      working_directory: './examples/external_key/'
      provider: 'aws'
      target_branch: 'master'
      aws_region: 'ca-central-1'
    secrets:
      BUILD_ROLE: ${{ secrets.BUILD_ROLE }}
  tf-checks-replica-key-example:
    if: github.actor != 'dependabot[bot]'
    uses: clouddrove/github-shared-workflows/.github/workflows/tf-checks.yml@v2
    with:
      working_directory: './examples/replica_key/'
      provider: 'aws'
      target_branch: 'master'
      aws_region: 'ca-central-1'
    secrets:
      BUILD_ROLE: ${{ secrets.BUILD_ROLE }}    
  tf-checks-external-replica-key-example:
    if: github.actor != 'dependabot[bot]'
    uses: clouddrove/github-shared-workflows/.github/workflows/tf-checks.yml@v2
    with:
      working_directory: './examples/external_replica_key/'
      provider: 'aws'
      target_branch: 'master'
      aws_region: 'ca-central-1'
    secrets:
      BUILD_ROLE: ${{ secrets.BUILD_ROLE }}    